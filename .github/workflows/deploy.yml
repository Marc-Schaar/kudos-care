name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and Build
        run: |
          npm install
          npm run build -- --configuration production

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "SSH Verbindung erfolgreich!"
            mkdir -p /var/www/kudoscare.marc-schaar.com
            chown -R $USER:$USER /var/www/kudoscare.marc-schaar.com
            rm -rf /var/www/kudoscare.marc-schaar.com/*
            # Hinweis: Du musst die Dateien jetzt noch vom Runner auf den Server übertragen
            # Am besten nutzt du dafür den 'appleboy/scp-action' Schritt

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/kudos-care/browser/*'
          target: '/var/www/kudoscare.marc-schaar.com'
          strip_components: 3

      - name: Restart Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /usr/bin/sudo /usr/bin/systemctl restart nginx
