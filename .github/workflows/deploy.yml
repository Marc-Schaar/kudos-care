name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build -- --configuration production

      # Zweistufig ueber ein Staging-Verzeichnis im Home von marc, analog zum
      # rsync-Schritt im Backend-Deploy. Direktes Schreiben in den Webroot mit
      # drone-scp "rm: true" geht nicht: das loescht den Zielordner selbst, und
      # /var/www gehoert root -- marc darf ihn nicht neu anlegen.
      - name: Copy build to staging dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/kudos-care/browser/*'
          target: '/home/marc/deploy/kudoscare-frontend'
          strip_components: 3
          overwrite: true
          timeout: 60s

      # rsync --delete fasst nur den *Inhalt* des Webroots an, nicht das
      # Verzeichnis selbst -- kein root noetig. Der Webroot ist damit nie
      # laenger leer als der rsync dauert (frueher: eigener rm-Schritt, dessen
      # Fehlschlag die Seite auf 403 stehen liess).
      - name: Publish to webroot
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            STAGING=/home/marc/deploy/kudoscare-frontend
            test -f "$STAGING/index.html" || { echo "index.html fehlt im Staging - Abbruch"; exit 1; }
            rsync -a --delete "$STAGING/" /var/www/kudoscare.marc-schaar.com/
            rm -rf "$STAGING"
            echo "=== Deployed ==="
            ls /var/www/kudoscare.marc-schaar.com/ | head
