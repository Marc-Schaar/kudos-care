name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # rsync --delete direkt in den Webroot: fasst nur den *Inhalt* an, nicht das
      # Verzeichnis selbst -- /var/www gehoert root, der Deploy-User darf den Ordner
      # also nicht neu anlegen. Damit ist der Webroot auch nie leer (frueher lief ein
      # eigener "rm -rf"-Schritt vorweg, dessen Fehlschlag die Seite auf 403 stehen liess).
      #
      # Retry, weil sshd auf dem Server Verbindungen per PerSourcePenalties abweisen
      # kann ("Not allowed at this time" -> handshake failed). Eine Penalty haelt ~15s,
      # 30s Backoff kommt also sicher darueber. rsync ist idempotent, ein Retry ist
      # gefahrlos.
      - name: Deploy to webroot
        env:
          HOST: ${{ secrets.SERVER_IP }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -uo pipefail
          SSH_OPTS="ssh -i $HOME/.ssh/id_deploy -o ConnectTimeout=15 -o BatchMode=yes"
          for attempt in 1 2 3 4 5; do
            if rsync -az --delete -e "$SSH_OPTS" \
                 dist/kudos-care/browser/ \
                 "$DEPLOY_USER@$HOST:/var/www/kudoscare.marc-schaar.com/"; then
              echo "Deploy erfolgreich (Versuch $attempt)"
              exit 0
            fi
            echo "Versuch $attempt fehlgeschlagen, warte 30s"
            sleep 30
          done
          echo "Deploy nach 5 Versuchen fehlgeschlagen"
          exit 1
