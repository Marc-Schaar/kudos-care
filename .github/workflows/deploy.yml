name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build -- --configuration production

      # Ein einziger SSH-Vorgang: drone-scp leert das Zielverzeichnis (rm: true) und
      # entpackt die neuen Dateien in derselben Verbindung. Frueher lief das "rm -rf"
      # in einem eigenen ssh-Schritt davor — schlug der Copy-Schritt fehl, blieb der
      # Webroot leer zurueck und nginx lieferte 403.
      # Jede zusaetzliche Verbindung erhoeht ausserdem das Risiko, in sshd's
      # PerSourcePenalties zu laufen ("Not allowed at this time" -> handshake failed).
      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/kudos-care/browser/*'
          target: '/var/www/kudoscare.marc-schaar.com'
          strip_components: 3
          rm: true
          overwrite: true
          timeout: 60s
