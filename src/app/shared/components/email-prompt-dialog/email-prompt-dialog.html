@if (visible()) {
  <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="email-prompt-title">
    <div class="dialog">
      <span class="dialog-eyebrow">Kudos Care</span>
      <h2 class="dialog-title" id="email-prompt-title">Wohin sollen wir dich warnen?</h2>
      <p class="dialog-text">
        Kudos Care meldet sich, sobald eine Komponente Aufmerksamkeit braucht — dafür fehlt nur noch
        deine E-Mail-Adresse. Du kannst das jederzeit im Benutzermenü ändern oder abschalten.
      </p>

      <form class="dialog-form" (ngSubmit)="save()">
        <label class="dialog-label" for="email-prompt-input">E-Mail-Adresse</label>
        <input
          id="email-prompt-input"
          class="dialog-input"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="du@example.de"
          autocomplete="email"
        />

        @if (error()) {
          <div class="dialog-error">{{ error() }}</div>
        }

        <div class="dialog-actions">
          <button type="button" class="btn-ghost" (click)="dismiss()">Später</button>
          <button type="submit" class="btn-primary" [disabled]="saving()">
            {{ saving() ? 'Speichert…' : 'Speichern' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
