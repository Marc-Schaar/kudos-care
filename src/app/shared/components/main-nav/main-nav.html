@if (visible()) {
  <!-- Am Handy eine Kopfzeile, die mit der Seite wegrollt. Am Desktop wird daraus die Fläche der
       Seitenleiste: Wortmarke oben, Benutzermenü unten, die Links liegen darüber. Dasselbe
       Element, damit es das Benutzermenü nur einmal gibt. -->
  <header class="chrome">
    <a class="wordmark" [routerLink]="nav.to.dashboard()" aria-label="Kudos Care, zur Übersicht">
      KUDOS<span class="wordmark-rule" aria-hidden="true"></span>CARE
    </a>
    <app-user-menu />
  </header>

  <nav class="nav" aria-label="Hauptnavigation">
    <a class="nav-item" [routerLink]="nav.to.dashboard()" routerLinkActive="active">
      <app-icon name="gauge" [size]="22" />
      <span class="nav-label">Start</span>
    </a>

    <a class="nav-item" [routerLink]="nav.to.activities()" routerLinkActive="active">
      <app-icon name="route" [size]="22" />
      <span class="nav-label">Fahrten</span>
    </a>

    <a
      class="nav-item"
      [routerLink]="nav.to.bikes()"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <app-icon name="bike" [size]="22" />
      <span class="nav-label">Räder</span>
    </a>

    @if (bikeId(); as id) {
      <a class="nav-item" [routerLink]="nav.to.bike(id)" routerLinkActive="active">
        <app-icon name="wrench" [size]="22" />
        <span class="nav-label">Mein Rad</span>
      </a>
    } @else {
      <span class="nav-item disabled" aria-disabled="true">
        <app-icon name="wrench" [size]="22" />
        <span class="nav-label">Mein Rad</span>
      </span>
    }

    <a class="nav-item" [routerLink]="nav.to.radcomputer()" routerLinkActive="active">
      <app-icon name="compass" [size]="22" />
      <span class="nav-label">Radcomputer</span>
    </a>
  </nav>
}
