<div class="auth-page">
  <div class="auth-card">
    <div class="header-eyebrow">KudosCare</div>

    @switch (status()) {
      @case ('loading') {
        <div class="loading-bar"></div>
        <h1 class="auth-title">Wird <span class="title-accent">verbunden</span></h1>
        <p class="auth-sub">Verbindung mit Strava wird hergestellt …</p>
      }
      @case ('error') {
        <div class="alert-banner critical">
          <span class="alert-icon">⚠</span>
          <span>{{ errorMessage }}</span>
        </div>
        <button (click)="retry()" class="retry-btn" type="button">Zurück zum Login</button>
      }
      @case ('success') {
        <div class="status-icon status-ok">✓</div>
        <h1 class="auth-title">Erfolgreich <span class="title-accent">verbunden</span></h1>
        <p class="auth-sub">Du wirst weitergeleitet zum Dashboard …</p>
      }
    }
  </div>
</div>
