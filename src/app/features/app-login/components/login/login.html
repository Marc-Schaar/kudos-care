<div class="connect-box">
  <h2>Kudo Care aktivieren</h2>
  <p>
    Verbinde dein Strava-Profil, um den wetterabhängigen Verschleiß deiner Komponenten zu tracken.
  </p>

  <button (click)="connectWithStrava()" class="strava-btn">
    <span class="btn-text">Connect with</span>
    <span class="strava-brand">STRAVA</span>
  </button>

  <p class="switch-account-hint">
    Nicht du oder möchtest ein anderes Strava-Konto verbinden?
    <a href="https://www.strava.com/logout" target="_blank" rel="noopener">
      Zuerst bei Strava abmelden</a
    >, danach hier erneut verbinden.
  </p>
</div>
