<header>
  <h1 class="sr-only">Radcomputer</h1>
  @if (settings.value().showStatusBar) {
    <div class="status">
      <button
        type="button"
        class="chip"
        [attr.aria-label]="'GPS ' + gpsText() + ' – Standort'"
        (click)="onGps()"
      >
        <span class="sense" [attr.data-state]="gps.state()"></span>
        GPS <small>{{ gpsText() }}</small>
      </button>
      <button
        type="button"
        class="chip"
        [attr.aria-label]="'PWR ' + pwrText() + ' – Powermeter'"
        (click)="sensors.connect('pwr')"
      >
        <span class="sense" [attr.data-state]="pwrState()"></span>
        PWR <small>{{ pwrText() }}</small>
      </button>
      <button
        type="button"
        class="chip"
        [attr.aria-label]="'HF ' + hrText() + ' – Pulsgurt'"
        (click)="sensors.connect('hr')"
      >
        <span class="sense" [attr.data-state]="hrState()"></span>
        HF <small>{{ hrText() }}</small>
      </button>
      <span class="clock digits"><span class="sr-only">Uhrzeit </span>{{ clock() }}</span>
    </div>
  }

  @if (navStrip(); as nav) {
    <button type="button" class="strip sign" (click)="openRidePage('map')">
      <rc-cue-sign [kind]="nav.kind" [distance]="nav.distance" [text]="nav.text" [off]="nav.off" />
    </button>
  }
  @if (workoutStrip(); as wo) {
    <button type="button" class="strip" (click)="openRidePage('workout')">
      <span class="wo-remaining digits">{{ wo.remaining }}</span>
      <span class="strip-text">{{ wo.text }}</span>
    </button>
  }
</header>

<main>
  <router-outlet />
</main>

<!-- Wie am Edge: Menü, Runde, Start. Ausgeblendet erscheint die Leiste nach einem Tipp auf die Fahrtseite. -->
@if (controlsVisible()) {
  <footer class="controls" [class.floating]="controlsFloating()" (click)="onControlsClick()">
    @if (onRide()) {
      <a class="btn icon" [routerLink]="rc.menu" aria-label="Menü">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </a>
    } @else {
      <a class="btn icon" [routerLink]="rc.ride" aria-label="Zur Fahrt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </a>
    }
    <button type="button" class="btn" [disabled]="ride.status() !== 'running'" (click)="ride.lap()">
      Runde
    </button>
    <button type="button" class="btn primary" (click)="ride.toggle()">{{ mainLabel() }}</button>
  </footer>
}

<div class="toast" role="status" aria-live="polite" [class.show]="toasts.message()">
  {{ toasts.message() }}
</div>
