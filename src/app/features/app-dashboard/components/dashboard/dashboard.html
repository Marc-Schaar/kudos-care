<H1>Dashboard</H1>
<button (click)="logout()">logout</button>
<button (click)="goToMaintenance()">Wartung</button>
<ul>
  <h2>Fahrräder:</h2>
  @for (bike of bikes(); track $index) {
    <li (click)="goToBike(+bike.id)">- {{ bike.name }}</li>
  }
</ul>

<ul>
  <h2>Aktivitäten:</h2>
  @for (activity of activities(); track $index) {
    <li (click)="goToActivity(+activity.id)">
      - {{ activity.name }} {{ activity.distance }} {{ activity.type }}
    </li>
  }
</ul>
