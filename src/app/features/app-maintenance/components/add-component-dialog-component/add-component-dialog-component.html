<div class="overlay" (click)="onOverlayClick($event)">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-header">
      <div class="dialog-label">NEUE KOMPONENTE</div>
      <button class="close-btn" (click)="close.emit()">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label class="label">Hersteller</label>
        <input
          class="input"
          type="text"
          [(ngModel)]="brand"
          name="brand"
          placeholder="z.B. Shimano, Continental…"
          autocomplete="off"
        />
      </div>

      <div class="field">
        <label class="label">Modell</label>
        <input
          class="input"
          type="text"
          [(ngModel)]="modelName"
          name="modelName"
          placeholder="z.B. Dura-Ace, GP5000…"
          autocomplete="off"
        />
      </div>

      <div class="field-row">
        <div class="field">
          <label class="label">Einbaudatum</label>
          <input
            class="input"
            type="date"
            [(ngModel)]="installedAt"
            (ngModelChange)="onInstalledAtChange()"
            name="installedAt"
          />
        </div>

        <div class="field">
          <label class="label">
            km-Stand bei Einbau
            @if (distanceLoading()) {
              <span class="field-hint">(wird berechnet…)</span>
            } @else if (!distanceManuallyEdited()) {
              <span class="field-hint">(automatisch anhand der Fahrten mit diesem Bike)</span>
            }
          </label>
          <input
            class="input"
            type="number"
            [(ngModel)]="distanceAtInstall"
            name="distanceAtInstall"
            [disabled]="!distanceManuallyEdited()"
            [placeholder]="bikeDistanceKm()?.toFixed(0) ?? '0'"
            step="0.1"
            min="0"
          />
          <label class="checkbox-label distance-override">
            <input
              type="checkbox"
              [ngModel]="distanceManuallyEdited()"
              (ngModelChange)="$event ? enableManualDistance() : disableManualDistance()"
              name="distanceManuallyEdited"
            />
            <span>km-Stand manuell korrigieren</span>
          </label>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="label">
            Lebensdauer (km)
            @if (template()?.warn_km) {
              <span class="field-hint">(empfohlen: {{ template()?.warn_km }} km)</span>
            }
          </label>
          <input
            class="input"
            type="number"
            [(ngModel)]="customWarnKm"
            name="customWarnKm"
            [placeholder]="template()?.warn_km?.toString() ?? ''"
            step="1"
            min="0"
          />
        </div>

        <div class="field">
          <label class="label">
            Lebensdauer (Tage)
            @if (template()?.warn_days) {
              <span class="field-hint">(empfohlen: {{ template()?.warn_days }} Tage)</span>
            }
          </label>
          <input
            class="input"
            type="number"
            [(ngModel)]="customWarnDays"
            name="customWarnDays"
            [placeholder]="template()?.warn_days?.toString() ?? ''"
            step="1"
            min="0"
          />
        </div>
      </div>

      <div class="field">
        <label class="label">Notizen</label>
        <textarea
          class="input textarea"
          [(ngModel)]="notes"
          name="notes"
          placeholder="Optional…"
          rows="2"
        ></textarea>
      </div>

      <div class="field-checkbox">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="isMounted" name="isMounted" />
          <span>Direkt montieren (ersetzt aktuelle Komponente)</span>
        </label>
      </div>

      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }

      <div class="dialog-actions">
        <button type="button" class="btn-cancel" (click)="close.emit()">Abbrechen</button>
        <button type="submit" class="btn-save" [disabled]="saving()">
          {{ saving() ? 'Speichern…' : 'Speichern' }}
        </button>
      </div>
    </form>
  </div>
</div>
