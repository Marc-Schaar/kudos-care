<div class="overlay" (click)="onOverlayClick($event)">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-header">
      <div class="dialog-label">KOMPONENTEN-SLOT HINZUFÜGEN</div>
      <button class="close-btn" (click)="close.emit()">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      @if (loading()) {
        <div class="loading-hint">Vorlagen werden geladen…</div>
      } @else if (availableTemplates().length === 0) {
        <div class="empty-hint">Alle verfügbaren Komponenten-Slots sind bereits angelegt.</div>
      } @else {
        <div class="field">
          <label class="label">Komponente</label>
          <div class="template-list">
            @for (template of availableTemplates(); track template.id) {
              <label class="template-option">
                <input
                  type="radio"
                  name="template"
                  [value]="template.id"
                  [(ngModel)]="selectedTemplateId"
                />
                <span class="template-category">{{ template.category_display }}</span>
                <span class="template-name">{{ template.name }}</span>
              </label>
            }
          </div>
        </div>

        <div class="field">
          <label class="label">Bezeichnung (optional)</label>
          <input
            class="input"
            type="text"
            [(ngModel)]="customName"
            name="customName"
            placeholder="z.B. Reifen vorne links…"
            autocomplete="off"
          />
        </div>
      }

      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }

      <div class="dialog-actions">
        <button type="button" class="btn-cancel" (click)="close.emit()">Abbrechen</button>
        <button
          type="submit"
          class="btn-save"
          [disabled]="saving() || loading() || availableTemplates().length === 0"
        >
          {{ saving() ? 'Anlegen…' : 'Anlegen' }}
        </button>
      </div>
    </form>
  </div>
</div>
