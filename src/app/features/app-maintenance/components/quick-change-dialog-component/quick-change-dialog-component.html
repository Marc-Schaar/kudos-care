<div class="overlay" (click)="onOverlayClick($event)">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-header">
      <div class="dialog-label">
        BAUGRUPPE TAUSCHEN
        <span class="dialog-label-sub">— {{ groupName }}</span>
      </div>
      <button class="close-btn" (click)="close.emit()">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label class="label">Einbaudatum (gemeinsam)</label>
        <input class="input" type="date" [(ngModel)]="installedAt" name="installedAt" />
      </div>

      <div class="field">
        <div class="row-list-header">
          <label class="label">Elemente der Baugruppe</label>
          <div class="row-list-toolbar">
            <span class="selected-count">{{ selectedCount() }} ausgewählt</span>
            <button type="button" class="toolbar-btn" (click)="selectAll()">Alle</button>
            <button type="button" class="toolbar-btn" (click)="selectNone()">Keine</button>
          </div>
        </div>

        <div class="row-list">
          @for (row of partRows; track row.templateId) {
            <label class="row-option" [class.selected]="row.include">
              <input
                type="checkbox"
                [(ngModel)]="row.include"
                [name]="'include-' + row.templateId"
              />
              <div class="row-body">
                <div class="row-heading">
                  <span class="row-name">{{ row.displayName }}</span>
                  <span class="row-current">
                    aktuell: {{ row.currentBrand || '—' }}
                  </span>
                </div>
                <div class="row-fields" (click)="$event.stopPropagation()">
                  <input
                    class="input"
                    type="text"
                    [(ngModel)]="row.brand"
                    [name]="'brand-' + row.templateId"
                    placeholder="Hersteller"
                    autocomplete="off"
                    [disabled]="!row.include"
                  />
                  <input
                    class="input"
                    type="text"
                    [(ngModel)]="row.modelName"
                    [name]="'model-' + row.templateId"
                    placeholder="Modell"
                    autocomplete="off"
                    [disabled]="!row.include"
                  />
                </div>
              </div>
            </label>
          }

          @for (row of intervalRows; track row.templateId) {
            <label class="row-option" [class.selected]="row.include">
              <input
                type="checkbox"
                [(ngModel)]="row.include"
                [name]="'iv-' + row.templateId"
              />
              <div class="row-body">
                <div class="row-heading">
                  <span class="row-name">{{ row.label }}</span>
                  <span class="row-current">Pflege — wird zurückgesetzt</span>
                </div>
              </div>
            </label>
          }
        </div>
      </div>

      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }

      <div class="dialog-actions">
        <button type="button" class="btn-cancel" (click)="close.emit()">Abbrechen</button>
        <button type="submit" class="btn-save" [disabled]="saving() || selectedCount() === 0">
          {{ saving() ? 'Wird getauscht…' : 'Baugruppe tauschen (' + selectedCount() + ')' }}
        </button>
      </div>
    </form>
  </div>
</div>
